name: Build Windows EXE

# 触发：
#   1) 推送 tag（如 v1.2.0）→ 自动构建并把 exe 上传到同名 Release
#   2) 手动在 Actions 页点 Run workflow → 仅构建并上传 artifact（便于验证）
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# 创建 Release 需要写权限
permissions:
  contents: write

jobs:
  build-windows-exe:
    name: Build EXE on Windows
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install PySide6==6.11.1 PySide6-Fluent-Widgets darkdetect PySideSix-Frameless-Window openpyxl xlrd

      - name: Build executable with PyInstaller
        # 与本地 build_exe.bat 完全一致：使用 build_exe.spec（单文件、无控制台窗口）
        run: python -m PyInstaller build_exe.spec --noconfirm --clean

      - name: Upload EXE to GitHub Release
        # 仅当由 tag 推送触发时才建 Release 并附 exe
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload EXE as workflow artifact (always)
        # 即使没打 tag 也能在 Actions 页下载产物验证构建是否通过
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lawfirm_app_exe
          path: dist/*.exe
          if-no-files-found: warn
